<f:layout name="PageLayout" />
<f:section name="Main">
  <h1>{page.title}</h1>

  <div style="display: flex; gap: 20px">
    <!-- Spalte Links (colPos = 0) -->
    <div style="flex: 1">
      <f:for each="{content.main.records}" as="contentElement">
        <f:cObject
          typoscriptObjectPath="{contentElement.mainType}"
          table="{contentElement.mainType}"
          data="{contentElement}"
        />
      </f:for>
    </div>

    <!-- Spalte Rechts (colPos = 1) -->
    <div style="flex: 1">
      <f:for each="{content.sidebar.records}" as="contentElement">
        <f:cObject
          typoscriptObjectPath="{contentElement.mainType}"
          table="{contentElement.mainType}"
          data="{contentElement}"
        />
      </f:for>
    </div>
  </div>
</f:section>
